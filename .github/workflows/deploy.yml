name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # vite.config.ts 里 已用 base: "./" 走相对路径,
      # GitHub Pages 部署在子路径下也能正常访问资源。
      - name: Build
        run: npm run build

      # SPA: 404 回到 index.html(当前 state-based router 不依赖,
      # 但为以后升级准备。)
      - name: Add SPA fallback
        run: cp dist/public/index.html dist/public/404.html

      # GitHub Pages 需要 .nojekyll 避免下划线目录被忽略
      - name: Disable Jekyll
        run: touch dist/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
